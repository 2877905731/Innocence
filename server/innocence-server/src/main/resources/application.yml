spring:
  application:
    name: innocence-server
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 314572800B
      max-request-size: 315621376B
      file-size-threshold: 0B

server:
  port: 8080

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.innocence.server
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.innocence.server.modules.assistant.mapper: WARN
    com.innocence.server.modules.plan.mapper: WARN
    com.innocence.server.modules.focus.mapper: WARN

innocence:
  assistant:
    enabled: ${INNOCENCE_ASSISTANT_ENABLED:false}
    endpoint: ${INNOCENCE_ASSISTANT_ENDPOINT:}
    api-key: ${INNOCENCE_ASSISTANT_API_KEY:}
    model: ${INNOCENCE_ASSISTANT_MODEL:}
  avatar:
    storage-dir: ./data/uploads/avatars
    public-path: /uploads/avatars
    max-bytes: 5242880
