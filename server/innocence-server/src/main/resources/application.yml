spring:
  application:
    name: innocence-server
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5242880B
      max-request-size: 6291456B

server:
  port: 8080

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.innocence.server
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

innocence:
  avatar:
    storage-dir: ./data/uploads/avatars
    public-path: /uploads/avatars
    max-bytes: 5242880
