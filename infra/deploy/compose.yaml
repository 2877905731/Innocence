name: innocence-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 640m
    environment:
      MYSQL_DATABASE: innocence
      MYSQL_USER: innocence
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run prepare.sh first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run prepare.sh first}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=30
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user=root --silent --execute="SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    logging: *logging

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    mem_limit: 128m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run prepare.sh first}
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nport 6379\nappendonly yes\nmaxmemory 48mb\nmaxmemory-policy noeviction\nrequirepass %s\n' "$$REDIS_PASSWORD" > /tmp/innocence-redis.conf
        chown redis:redis /tmp/innocence-redis.conf
        exec docker-entrypoint.sh redis-server /tmp/innocence-redis.conf
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'test "$$(REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --raw ping)" = PONG']
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *logging

  backend:
    build: .
    image: innocence-server:local
    init: true
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 30s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      INNOCENCE_BIND_ADDRESS: 0.0.0.0
      INNOCENCE_PORT: "8080"
      INNOCENCE_DB_URL: jdbc:mysql://mysql:3306/innocence?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      INNOCENCE_DB_USER: innocence
      INNOCENCE_DB_PASSWORD: ${MYSQL_PASSWORD:?Run prepare.sh first}
      INNOCENCE_REDIS_HOST: redis
      INNOCENCE_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run prepare.sh first}
      INNOCENCE_ADMIN_EMAILS: ${INNOCENCE_ADMIN_EMAILS:?Fill INNOCENCE_ADMIN_EMAILS in .env}
      INNOCENCE_MAIL_HOST: ${INNOCENCE_MAIL_HOST:-smtp.invalid}
      INNOCENCE_MAIL_PORT: ${INNOCENCE_MAIL_PORT:-465}
      INNOCENCE_MAIL_USERNAME: ${INNOCENCE_MAIL_USERNAME:-not-configured@example.invalid}
      INNOCENCE_MAIL_PASSWORD: ${INNOCENCE_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${INNOCENCE_MAIL_SSL:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${INNOCENCE_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${INNOCENCE_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      SERVER_SHUTDOWN: graceful
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - avatars:/app/data/uploads/avatars
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", http://127.0.0.1:8080/actuator/health]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 60s
    logging: *logging

volumes:
  mysql_data:
  redis_data:
  avatars:
