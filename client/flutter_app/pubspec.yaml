name: innocence_flutter
description: Innocence mobile and desktop companion app.
publish_to: "none"
version: 1.3.2+14

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  shared_preferences: ^2.2.3
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/crimson_text/OFL.txt
    - assets/fonts/noto_serif_sc/OFL.txt
  fonts:
    - family: CrimsonText
      fonts:
        - asset: assets/fonts/crimson_text/CrimsonText-Regular.ttf
        - asset: assets/fonts/crimson_text/CrimsonText-Italic.ttf
          style: italic
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/noto_serif_sc/NotoSerifSC-Variable.ttf
  shaders:
    - shaders/glass_refraction.frag
